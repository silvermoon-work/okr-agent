# Current review design; aligned with silvermoon-events.md, not generated from runtime.
# Runtime Spec: silvermoon-single-checker.yaml. Historical proposal: silvermoon-idea-check-candidate.yaml.
$schema: urn:ipfsaw:check-bundle:1
specVersion: "1.0"
name: Silvermoon · Idea 推进检查（最新设计稿，尚未实现）
description: |
  检查指定 Idea 的材料、事件、内容确认、实现验证、部署证据及 primary 同步，
  按有序检查点返回首个未达成关口；全部通过才表示 Idea 完成。

  **这是与 silvermoon-events.md 对齐的最新设计稿，不是当前运行时规格。**
  目标模型取消事件 id/version，以 object + revision 确认内容；
  upstream 仅绑定直接前序，五个共识 revision 递归覆盖材料及依赖。
  相同内容及依赖的重复 submit 幂等归并，不重置已有确认。
  Idea 固定 eventSchemaCid，Schema 使用 RFC 8785 → SHA-256 → CIDv1(raw)；
  Checker 的执行 CID 单独记录，不把结构契约当成完整业务语义。

  当前运行时仍要求事件 id 和 version: 1、signOff.submit 事件引用、
  本阶段材料摘要及固定 checkCid。本文的目标事件不能写入现有日志；
  历史事件、固定 Check CID、CAR 和原始字节不自动迁移。
  本预览只展示定义，不执行 Check、项目代码、发布、部署或 Git 操作。
parameter:
  schema:
    type: object
    additionalProperties: false
    required: [userHome, repoRoot, idea]
    properties:
      userHome:
        type: string
        minLength: 1
      repoRoot:
        type: string
        minLength: 1
      idea:
        type: string
        minLength: 1
checkpoints:
  - id: global
    title: 全局 Silvermoon 已正确配置
    description: 检查全局 Silvermoon 安装、个人 skill 链接及用户配置是否有效。
    instructions: |
      按 Rules 定位实际安装、个人 skill 或配置问题，在已有授权范围内修复后重试原命令。
      不通过项目依赖或 skill 副本绕过设备边界；本检查点不要求 Git 仓库或 Idea。
      安装、升级、配置和链接变更仍需独立授权，Check 不自动修复。
    rules:
      - code: global-runtime-ready
        description:
          实际入口必须是当前 Silvermoon 安装的规范 bin，PATH 首个 silvermoon
          指向同一安装；允许全局链接开发版，不要求联网查询 registry 最新版。
      - code: global-skill-linked
        description:
          个人发现路径 .agents/skills/silvermoon 或 .copilot/skills/silvermoon
          须有效链接到当前安装的 canonical skill，不是副本或其他安装。
      - code: global-configuration-valid
        description:
          个人配置存在时须可解析、结构及协议受支持、字段及规范语言标签有效；
          协议允许缺省时可以不存在，不能自动初始化。
    output:
      description: 提供本次核验的个人内容语言，仅供当前执行共享。
      fields:
        - name: userLanguage
          description:
            规范语言标签或 undefined，后续按 Idea、项目、用户、en-US
            取有效内容语言。
  - id: repository
    title: 仓库在可继续工作的状态
    description: 检查仓库根目录、有效 HEAD、关联分支及工作区洁净性。
    instructions: |
      保留已有修改，按授权通过普通 Git 操作提交候选；不得删除、隐藏或重置改动取得通过。
      本检查点不解析 Idea 内容，不自动 stage、commit、push 或 clean。
    rules:
      - code: repository-root-valid
        description:
          repoRoot 须是可安全读取、有有效 HEAD 的 Git
          根目录，不能是重定向路径或子目录。
      - code: repository-branch-attached
        description: HEAD 须关联本地分支，不能处于 detached HEAD。
      - code: repository-worktree-clean
        description: 工作区须无已暂存、未暂存或未跟踪改动；草稿和事件也须已提交。
    output:
      description: 提供本次仓库定位和起始提交，不把 Git 状态当作内容批准。
      fields:
        - name: root
          description: 已验证的仓库根，后续文件和 Git 观察限于此范围。
        - name: head
          description: 本次观察的准确 HEAD，用于发现执行期间并发变化。
  - id: branch
    title: 分支已正确跟踪并同步 primary
    description: 检查项目配置、分支跟踪关系与本次观察的 primary 同步。
    instructions: |
      按 Rules 核对配置和同步事实；需要集成并发历史时仅执行已授权的普通 Git 操作。
      不擅自改变 primary 绕过门禁，不自动 pull、merge、rebase 或 push。
    rules:
      - code: branch-silvermoon-config-valid
        description:
          项目配置须可解析、协议受支持，primaryRepository 和 primaryBranch
          有效。
      - code: branch-primary-present
        description:
          配置仓库须存在指定 primaryBranch；查询失败或不确定不等于不存在。
      - code: branch-upstream-aligned
        description: 本地分支 upstream 的远端仓库和分支须对应项目 primary 配置。
      - code: branch-primary-synchronized
        description:
          HEAD 须等于本次 primary tip。默认获取远端 primary 并读 FETCH_HEAD；
          显式本地模式只证明远端跟踪快照，不声明网络新鲜性。Check 不修改分支。
    output:
      description: 提供本次项目配置及准确 primary 观察，供后续同一次检查复用。
      fields:
        - name: project
          description: 已验证的仓库 root 和配置。
        - name: observed
          description: 本次 HEAD、primary tip、remote、变更及配置事实。
  - id: silvermoon-folder
    title: Silvermoon 数据容器有效
    description: 检查 Silvermoon 数据容器、配置及 Idea 目录的路径安全性。
    instructions: |
      只修复 Rules 指出的容器问题，不扫描、迁移或删除既有 Ideas。
      首个 Idea 前 i 目录可以不存在；创建事务、并发复核及失败恢复属于 CLI 写入层。
    rules:
      - code: silvermoon-folder-path-valid
        description:
          .silvermoon 须是普通安全目录，不是符号链接、重定向或其他类型。
      - code: silvermoon-folder-config-file-valid
        description:
          .silvermoon/config.yaml 须是普通安全文件，大小不超过协议容量限制。
      - code: silvermoon-folder-ideas-directory-valid
        description:
          .silvermoon/i 首次创建前可以不存在；存在时须是普通安全目录。
    output:
      description: 成功输出为 undefined，不新增数据或跨执行 readiness 标记。
  - id: idea-folder
    title: Idea 数据与内容版本有效
    description:
      核验选中 Idea 的 Schema 绑定、事件历史和递归内容版本并推导当前状态。
    instructions: |
      **目标模型尚未实现，不使用现有 CLI 写入以下示例。**
      实现后读取本次前序成功输出，按 Rules 核对选中 Idea；
      无法取得可信的固定 Schema 或出现并发变化时停止并明确报错，不猜测最新版本替代。

      ### 数据契约与执行身份

      bootstrap 固定 eventSchemaCid，唯一 created 记录相同初始绑定；
      先从 bootstrap 取得 Schema 再解析日志。created 的字段为 at、type、
      idea、eventSchemaCid 和可选 language。它不固定 Checker 实现。
      其余事件不重复 Schema 标识；所有事件都没有 id、version 或 $schema。
      Idea ID、Git 提交 ID、用例 ID 与 Spec 的 specVersion 不属于事件 ID/version。
      Checker 的实际执行 CID 在检查结果中单独记录，不写进 created。
      Schema 不完整定义生命周期语义；复现历史判定还须固定规则规格或 Check。
      CID 只证明内容完整性，不证明可信或授权执行；不得隐式执行 Schema 或文档。

      对满足 RFC 8785 / JCS 输入约束的 JSON Schema：

      ```text
      bytes = UTF-8(JCS(schema))
      multihash = sha2-256(SHA-256(bytes))
      eventSchemaCid = base32lower(CIDv1(raw, multihash))
      ```

      上式 multihash 表示算法代码 0x12、长度 32 和 SHA-256 摘要的编码，
      不是对摘要再次计算哈希。CIDv1 使用 raw codec 0x55，
      无填充小写 base32 字符串带 b 前缀；存储准确 canonical bytes，不加 BOM 或换行。
      JCS 按 UTF-16 码元排序键、保持数组顺序并规范字符串和 IEEE 754 数值；
      重复键、无效 Unicode 或不满足数值约束必须拒绝，不用普通 JSON.stringify 冒充 JCS。
      这是 raw 中的 JCS JSON，不是 DAG-JSON。自包含 Schema 的 $ref 只指向内部 $defs，
      $id 保留稳定 URN，不把自身 CID 写入定义形成循环。
      外部依赖如以后引入也须不可变绑定；dialect 和格式断言由受控校验环境支持，
      不隐式联网。JCS 稳定表示，不归并语义相同而 JSON 值不同的 Schema。

      ### 单链内容版本

      requirements/ 全部材料 → technical/research.md → technical/ 排除 research.md
      → tests/cases.json → tests/ 排除 cases.json。
      对象键依次为 requirements、research、technical、cases、tests。
      user-acceptance 的直接前序为 tests，但其 revision 是部署报告原始字节摘要。
      upstream 只保存直接前序 revision，requirements 为 null；不写完整版本向量。

      ```text
      files = 按路径 ASCII 排序的 [相对路径, sha256(文件原始字节)] 列表
      revision = sha256(UTF-8(canonical({ object, files, upstream })))
      ```

      canonical 是递归 ASCII 键序的紧凑 JSON，摘要用 sha256: 加 64 位小写十六进制。
      所有范围内附件都参与；前序 revision 递归计算，时间和事件日志不参与。
      祖先变化即使本阶段正文未改也会改变后续 revision。
      填充用例正文不改变独立 cases 索引的 revision，因为后续不参与前序摘要。
      Schema JCS 编码与材料 revision 定义各自独立，不更改原始报告摘要。

      ### 提交、确认与幂等归并

      submit 仅含 at、type、object、revision、upstream。
      除根外，前序必须已确认且同步，再提交准确材料供用户 review。
      signOff 仅含 at、type、object、revision；只在用户明确接受准确材料后追加：

      ```json
      {
        "at": "<current-UTC-ISO-time>",
        "type": "signOff",
        "object": "technical",
        "revision": "<state.revisions.technical>"
      }
      ```

      signOff 确认内容，不引用 submit，不重复 upstream 或 decision。
      同一 Idea 的相同 object、revision、upstream 的 submit 幂等归并，
      仅展示最后追加行的 at，不重置已有确认。相同 object + revision 的 signOff 也幂等。
      每个对象当前候选仍取最后 submit 的版本，不能拿较早版本覆盖后来不同版本。
      按行顺序回放，不按时间戳排序，时间不是唯一键。
      首次确认前须已有同版本 submit，且确认时仍是当前有效候选、依赖准确。
      孤立、前向、跨 Idea 或迟到的不同版本确认无效。
      归并不删除、覆盖或重排历史，也不绕过验证、部署新轮次或用户实际体验。
      返回完全相同材料及依赖可复用内容确认，仍须核对全部关口、证据和同步。

      Agent 先提交再展示完整准确材料；用户未接受就等待或修改，不推断批准。
      同步时按已有授权检查 worktree/staged，提交并同步材料、有效 submit/signOff；
      不因重复同版本行要求新的用户决定，不把未同步内容当作完成。
      写入前核对 eventDigest、版本及 primary，保留原始 UTF-8 前缀，
      新行使用递归 ASCII 键序、LF、最终换行；冲突重新观察，不覆盖他人历史。

      ### 两阶段验证与证据

      verify 仅含 at、type、phase、rev；implementation.rev 是准确受测 Git 提交，
      deployment.rev 是固定 evidence/deployment/report.jsonl 的原始字节 SHA-256。
      实现须实际执行全部已确认自动化用例并通过；不另存实现报告或测试输出副本。
      验证记录不独立证明执行发生，Check 不自动运行项目代码。
      复测失败不能以旧成功继续推进。

      部署实际交付已经实现验收并同步的代码，逐项操作完整 E2E 手工用例。
      报告 start 含 version=1、type=start、implementation、可选非空 context；
      case 含 type=case、case、非空 steps/expected/actual、result，
      result 为 pass/fail/error/blocked/not-run，不允许额外字段。
      第一行及每轮先追加 start，最新 start 到末尾为当前轮；
      同轮 case 取最后尝试，新轮须重新覆盖全部部署用例，失败行不删除。
      全部必需 case 最后为 pass 才通过；不写整体结果或完成行，不回退旧成功。
      报告、用例索引的 version: 1 保持不变，不能当成事件级 version。
      报告原始字节必须保留 primary 准确前缀，只能追加完整行。
      追加后重新计算整份报告 rev 并记录 verify；只校验最新部署事件与当前报告，
      历史 rev 不要求匹配追加后的文件。报告、安全附件和事件须一起提交并同步。
      报告上限 1 MiB/4096 行，每轮最多 512 个不同部署用例；
      事件上限独立为 1 MiB/4096 行，Idea 总容量 16 MiB，不截断历史绕过限制。

      ### 事件形态的统一 JSON Schema

      与 silvermoon-events.md 的单行事件 Schema 相同，结构校验不代替后续业务 Rules：

      ```json
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "urn:silvermoon:events",
        "title": "Silvermoon Event",
        "type": "object",
        "properties": {"at": {"$ref": "#/$defs/timestamp"}},
        "required": ["at", "type"],
        "oneOf": [
          {
            "properties": {
              "type": {"const": "created"},
              "idea": {"type": "string", "pattern": "^[0-9]{12}[a-f0-9]{4}$"},
              "eventSchemaCid": {"$ref": "#/$defs/schemaCid"},
              "language": {"$ref": "#/$defs/nonempty"}
            },
            "required": ["idea", "eventSchemaCid"]
          },
          {
            "properties": {
              "type": {"const": "submit"},
              "object": {"$ref": "#/$defs/object"},
              "revision": {"$ref": "#/$defs/digest"},
              "upstream": {"oneOf": [{"type": "null"}, {"$ref": "#/$defs/digest"}]}
            },
            "required": ["object", "revision", "upstream"],
            "if": {"properties": {"object": {"const": "requirements"}}, "required": ["object"]},
            "then": {"properties": {"upstream": {"type": "null"}}},
            "else": {"properties": {"upstream": {"$ref": "#/$defs/digest"}}}
          },
          {
            "properties": {
              "type": {"const": "signOff"},
              "object": {"$ref": "#/$defs/object"},
              "revision": {"$ref": "#/$defs/digest"}
            },
            "required": ["object", "revision"]
          },
          {
            "properties": {
              "type": {"const": "verify"},
              "phase": {"const": "implementation"},
              "rev": {"$ref": "#/$defs/commit"}
            },
            "required": ["phase", "rev"]
          },
          {
            "properties": {
              "type": {"const": "verify"},
              "phase": {"const": "deployment"},
              "rev": {"$ref": "#/$defs/digest"}
            },
            "required": ["phase", "rev"]
          },
          {
            "properties": {
              "type": {"const": "setAlias"},
              "alias": {"oneOf": [
                {"type": "null"},
                {"type": "string", "maxLength": 64, "pattern": "^[a-z][a-z0-9-]*$"}
              ]}
            },
            "required": ["alias"]
          },
          {
            "properties": {
              "type": {"const": "setLanguage"},
              "language": {"oneOf": [{"type": "null"}, {"$ref": "#/$defs/nonempty"}]}
            },
            "required": ["language"]
          },
          {
            "properties": {
              "type": {"const": "abandon"},
              "reason": {"$ref": "#/$defs/nonempty"}
            },
            "required": ["reason"]
          },
          {"properties": {"type": {"const": "resume"}}}
        ],
        "unevaluatedProperties": false,
        "$defs": {
          "nonempty": {"type": "string", "minLength": 1, "pattern": "\\S"},
          "schemaCid": {"type": "string", "pattern": "^b[a-z2-7]+$"},
          "timestamp": {
            "type": "string", "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
          },
          "digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
          "commit": {"type": "string", "pattern": "^[a-f0-9]{40}(?:[a-f0-9]{24})?$"},
          "object": {"enum": [
            "requirements", "research", "technical", "cases", "tests", "user-acceptance"
          ]}
        }
      }
      ```

      严格支持 Draft 2020-12、unevaluatedProperties 及 date-time 格式断言，
      未声明字段不剔除或忽略。规范 UTC 时间、CID 配置、bootstrap 一致性、
      BCP 47 规范标签、路径/容量/字节前缀及业务状态另由 Rules 核验。
      现有 runtime Spec、历史 checkCid 与 CAR 不自动改绑或迁移，
      不将旧 ID 配对确认或旧材料摘要自动转换为新内容确认。
    rules:
      - code: idea-folder-identity-immutable
        description:
          选中目标 Idea 的 bootstrap.id、createdAt、eventSchemaCid
          及其他既有身份字段 须保留 primary 值；created.idea、at、eventSchemaCid
          分别一致，且 created 第一条唯一。 不将历史 checkCid
          直接替换或重命名；不校验其他 Idea。
      - code: idea-folder-schema-binding-valid
        description:
          目标 bootstrap 的固定 eventSchemaCid 须可解析为 CIDv1/raw/sha2-256，
          小写 base32，块字节哈希准确匹配；块须为合法自包含 Events Schema 的 JCS
          UTF-8， 无 BOM/末尾换行，重新 JCS 后字节一致。校验环境支持指定 dialect
          和格式断言。 Schema
          不可用、不受支持或不可信明确报错，不回退当前默认，不隐式获取外部引用。
          执行 Check CID 单独记录在结果，不要求与 Schema CID 相同。
      - code: idea-folder-event-history-append-only
        description:
          选中 Idea 的事件须保留 primary 原始 UTF-8 准确前缀，仅追加完整 LF 行；
          reducer 归并不修改、删除、截断或重排日志，事件没有 id/version。
      - code: idea-folder-deployment-report-append-only
        description:
          固定部署报告须保留 primary
          原始字节准确前缀，仅追加完整行；尚无报告可新建。
          生命周期和后续提交检查均保护同一约束，不改写旧证据。
      - code: idea-folder-revisions-valid
        description:
          五个 revision 严格按上述 object、全范围 files 和单个 upstream
          递归摘要计算； requirements upstream 为
          null，其余绑定唯一直接前序，禁止完整向量。
          时间和日志不参与；任一祖先变化改变下游
          revision；独立索引不依赖用例正文。
      - code: idea-folder-content-confirmations-valid
        description:
          按日志顺序，同版本 submit 必须先于首次 signOff，确认时为当前有效候选、
          递归依赖准确且前序已确认；signOff 只含 at/type/object/revision。 相同
          object/revision/upstream 的 submit 归并展示最后追加
          at，不重置同版本确认； 相同 object/revision 的 signOff 幂等。不按 at
          排序，不把旧版本确认套用到新版本。
          回到完全相同材料和依赖可复用内容确认，仍须满足验证、证据及同步。
      - code: idea-folder-data-valid
        description:
          bootstrap、文件树、事件、用例索引、固定报告符合目标 Schema、规范时间、
          CID/语言/路径和上述容量要求；未知字段及格式无效为明确数据问题。 verify
          按阶段只含准确 rev，最新部署事件与当前报告哈希匹配，不校验历史 rev
          等于新文件。 当前版本未确认为相应共识关口未达成，不回退旧成功；意外
          I/O、取消、 不支持协议或并发变化明确传播为执行错误。
      - code: idea-folder-active
        description:
          Idea 须有效推进；abandon 后须明确授权且有效的 resume
          才能恢复，不自动代写。
    output:
      description:
        提供当前 Idea、Schema 绑定、事件及准确 primary 快照归约的同一次状态；
        后续只消费本输出，不另建 reducer。运行时接入前不伪造当前 CLI
        已提供这些字段。
      fields:
        - name: state
          description: |
            revisions 为五个当前递归摘要；submitted 按对象记录最后候选 revision，
            signed 记录当前有效确认 revision，不保存事件 ID。
            重复同版本行仅更新展示时间，不重置确认；缺 submit、未确认或依赖失效停在对应阶段。
            有效确认未同步为 synchronization，next 指相应阶段。
            primary 须包含有效内容 submit/signOff 及当前材料版本，重复行不要求重新用户决定。
            implementation 为当前有效准确受测提交；deployment 为当前有效固定报告摘要；
            各取该阶段最后 verify，不挑旧成功，不生成第二份集合摘要。
            实现提交须包含五个当前确认版本，之后仅本 Idea events/evidence 元数据可变；
            最新部署报告绑定同一实现，部署 verify 位于最新实现 verify 之后。
            user-acceptance 的 submitted/signed 为当前部署报告摘要，交付及前序均须有效。
            level 是首个未达成领域阶段；前序阻断时不据后序 signed 缺失另判后序失败。
            只有当前用户接受与最终同步均满足才 completed。
        - name: brief
          description:
            受控事实摘要，包含状态、版本、eventDigest、primary 和
            subject，不泄漏文档全文。
  - id: requirements
    title: 需求共识已确认并同步
    description: 检查当前需求内容版本已获明确确认且材料和事件已同步。
    instructions: |
      1. 完成 requirements/Spec.md 及全部附件，说明问题、目标、范围与非目标、场景和验收标准。
      2. 实现目标模型后观察 idea-folder 的 revisions、eventDigest、primary，先 submit 当前版本：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"submit","object":"requirements","revision":"<state.revisions.requirements>","upstream":null}
      ```

      3. 展示准确全部材料和差异，请用户决定；未接受就等待或迭代，不推断批准。
      4. 接受后按共享模板记录 object=requirements、revision=准确需求版本的 signOff。
      5. 按授权检查 worktree/staged 并提交同步；重复同版本 submit 不需新的确认。
      level=requirements 表示尚未确认；synchronization/next=requirements 表示等待同步。
    rules:
      - code: requirements-consensus-confirmed
        description:
          当前候选 submit.object=requirements，revision
          等于当前递归需求摘要、upstream=null， 同版本已有有效
          signOff，state.signed.requirements 等于该 revision；
          不以任意旧记录或正文复选框推断通过。
      - code: requirements-synchronized
        description:
          当前需求全部材料与有效同版本 submit/signOff 须包含在本次 primary；
          synchronization/next=requirements
          时不通过，重复同版本行不重置用户确认。
    output:
      description: 成功为 undefined，后续继续使用同一次 idea-folder 状态。
  - id: research
    title: 调研共识已确认并同步
    description: 检查当前调研问题索引已确认、绑定需求并完成同步。
    instructions: |
      1. 编写 technical/research.md，列出调研问题、用户关注点、待查证事实及影响，不冒充完成结论。
      2. 当前需求版本确认且同步后，submit 问题索引，再展示准确材料：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"submit","object":"research","revision":"<state.revisions.research>","upstream":"<state.revisions.requirements>"}
      ```

      3. 明确接受后记录 object=research 和相同 revision 的 signOff；内容或依赖变更重新提交。
      4. 按已有授权检查并同步材料和事件，重新观察；不要求重复相同版本再确认。
    rules:
      - code: research-consensus-confirmed
        description:
          最新 research 候选 revision 等于当前递归 research 摘要， upstream
          仅等于已确认需求 revision；同版本有效 signOff 使 signed.research
          等于此 revision。 需求改变而索引未改仍改变 research
          revision，不能沿用旧版本确认。
      - code: research-synchronized
        description:
          当前问题索引、有效 submit/signOff 和前序内容确认均须存在于本次
          primary。
    output:
      description: 成功为 undefined，后续复用问题范围及同一次内容链事实。
  - id: technical
    title: 技术共识已确认并同步
    description: 检查技术方案及全部附件已确认、绑定调研范围并完成同步。
    instructions: |
      1. 完成已确认范围内调研，将依据、方案取舍、接口、错误处理、实施计划与验证方法写入
         technical/Spec.md 及附件；排除独立 technical/research.md。
      2. 前序已确认同步后先提交，再向用户展示所有技术材料：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"submit","object":"technical","revision":"<state.revisions.technical>","upstream":"<state.revisions.research>"}
      ```

      3. 用户明确接受后记录 object=technical 和相同 revision 的 signOff，检查并同步。
      4. 正文、计划、附件或祖先变化都产生新 revision，不以微调为由绕过确认。
    rules:
      - code: technical-consensus-confirmed
        description:
          最新 technical revision 等于当前全部技术材料加 research upstream
          的递归摘要， upstream 仅为已确认 research revision；同版本有效 signOff
          使 signed.technical 等于此 revision。 不引用事件 ID，不重复
          requirements/research 完整向量。
      - code: technical-synchronized
        description:
          当前技术全部材料、有效同版本 submit/signOff 及前序链须存在于本次
          primary。
    output:
      description:
        成功为 undefined，不新增事件或独立状态，后续复用 idea-folder。
  - id: test-index
    title: 用例索引共识已确认并同步
    description: 检查实现与部署用例索引完整、确认并同步。
    instructions: |
      1. 完成 tests/cases.json；每项仅有唯一 id 和 phase，包含 implementation 与 deployment。
         用例 ID 大写字母开头，仅大写字母、数字、连字符，最多 512 项。

      ```json
      {"version":1,"cases":[{"id":"I-01","phase":"implementation"},{"id":"D-01","phase":"deployment"}]}
      ```

      2. 前序技术内容已确认同步后 submit，展示范围、阶段分工及准确版本：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"submit","object":"cases","revision":"<state.revisions.cases>","upstream":"<state.revisions.technical>"}
      ```

      3. 接受后记录 object=cases 和该 revision 的 signOff，检查并同步。
      索引 version: 1 和用例 id 保留，不与取消事件 id/version 混淆。
      检查点 id=test-index，事件对象及状态键仍为 cases。
    rules:
      - code: test-index-consensus-confirmed
        description:
          索引符合上述严格结构，含实现及部署阶段，case id 唯一，不含
          environment/subject。 当前 cases revision 绑定索引及 technical
          upstream，同版本确认使 signed.cases 等于 revision。
          填充后续正文不改变此 revision。
      - code: test-index-synchronized
        description:
          当前索引、有效同版本 submit/signOff 和前序链须存在于本次 primary。
    output:
      description:
        成功为 undefined，后续复用索引和内容版本，不用正文替代机器索引。
  - id: test-cases
    title: 测试共识已确认并同步
    description: 检查详细测试材料已确认、绑定独立索引并完成同步。
    instructions: |
      1. 在 tests/Spec.md 及附件按索引写详细用例：实现的自动化映射、依赖、明确入口与判据；
         部署的前置、实际操作、预期和测试条件；必要附件要求写在对应用例。
      2. cases 已确认同步后先 submit，再 review 全部正文及支持材料：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"submit","object":"tests","revision":"<state.revisions.tests>","upstream":"<state.revisions.cases>"}
      ```

      3. 接受后记录 object=tests 和相同 revision 的 signOff，检查并同步。
      索引变化先回到 test-index；本阶段范围排除 cases.json，测试计划不等于实际执行证据。
      检查点 id=test-cases，事件对象及状态键仍为 tests。
    rules:
      - code: test-cases-consensus-confirmed
        description:
          当前 tests 摘要包含除 cases.json 外全部测试材料及单个 cases upstream，
          同版本已先 submit 并有效确认，signed.tests 等于 revision，前序链有效。
      - code: test-cases-synchronized
        description:
          当前详细用例、附件、有效 submit/signOff 及前序链须存在于本次 primary。
    output:
      description:
        成功为 undefined，后续承接五个内容共识，不额外保存 approved 标记。
  - id: implementation
    title: 实现验收已通过并同步
    description: 检查准确提交已完成可重现自动化测试且实现、测试和事件已同步。
    instructions: |
      1. 五个共识通过后完成实现及自动化测试，将代码、锁文件、明确入口和当前五个版本纳入准确提交。
      2. 按已有授权在该准确提交执行全部实现用例，包括要求的平台组合。
         失败、错误、阻塞、未执行不能通过；复测失败不能拿旧成功继续。
      3. 全部通过后核对并发和版本，记录实际受测提交：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"verify","phase":"implementation","rev":"<exact-tested-commit-SHA>"}
      ```

      4. 按授权检查 worktree/staged，提交并同步实现、测试和事件，重新观察才进入部署。
      不存实现报告或输出副本，不增加事件 ID/version，不以可重现代替实际执行。
    rules:
      - code: implementation-evidence-valid
        description:
          五个当前递归内容版本确认且同步后，取最后 implementation verify； rev
          须为 HEAD 祖先或自身，快照含当前五个确认版本，除本 Idea
          events/evidence 元数据
          外所有受跟踪内容与当前相同，包含测试、锁文件和配置。 Agent
          须实际执行全部自动化用例并通过，入口及依赖可复现； Check
          核验绑定不证明实际执行，不回退旧成功。有效 implementation 等于 rev。
      - code: implementation-synchronized
        description:
          实现提交、测试及对应 verify 须包含在本次
          primary，工作区洁净、HEAD=primary tip； 本地事件或 push
          成功不代替同步，未同步不进入部署。
    output:
      description: 成功为 undefined，部署复用当前准确实现版本及已同步事实。
  - id: deployment
    title: 部署与 Agent 自验已通过并同步
    description: 检查当前实现的完整手工 E2E 报告、版本绑定及同步。
    instructions: |
      1. 实现关口通过后仅按已有部署授权操作准确交付，Check 不授权生产、发布或付费操作。
      2. 在 evidence/deployment/report.jsonl 先追加 start，再逐项实际操作全部部署用例并记录：

      ```jsonl
      {"version":1,"type":"start","implementation":"<state.implementation>"}
      {"type":"case","case":"D-01","steps":"实际操作交付入口。","expected":"符合已确认用例预期。","actual":"实际观察到符合预期。","result":"pass"}
      ```

      3. 失败和阻塞如实记录；同轮复测只追加，新轮重新覆盖全部用例，不以命令成功代替手工验收。
      4. 保存后计算整份报告原始字节摘要并记录：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"verify","phase":"deployment","rev":"<sha256-of-raw-report-bytes>"}
      ```

      5. 保留报告和事件准确前缀，按授权检查并提交同步，再交给用户体验，不能直接完成 Idea。
    rules:
      - code: deployment-evidence-valid
        description:
          最后 deployment verify 须位于最后 implementation verify 后，
          当前安全普通报告全文件 SHA-256 等于 rev，全部行结构有效。 最新 start
          绑定当前实现，同轮最后 case 恰好覆盖所有已确认部署用例且全部 pass；
          未知用例、非 pass、缺项、摘要不符或过期均阻断，不跨轮回退成功。
          历史失败保留，历史事件不要求匹配当前报告；有效 deployment 等于 rev。
          报告与 Check 不独立证明操作真实发生，也不等于用户接受。
      - code: deployment-synchronized
        description:
          当前报告、必要附件及最新 verify 须存在于本次
          primary，工作区洁净、HEAD=primary tip； 自验和同步通过后才进入
          user-acceptance，不据此直接完成。
    output:
      description: 成功为 undefined，用户验收复用准确实现和报告摘要。
  - id: user-acceptance
    title: 用户体验验收已确认并同步
    description: 检查用户已实际体验并接受准确交付且确认事件完成最终同步。
    instructions: |
      1. 部署和自验已同步后先 submit 当前交付，再提供体验入口、操作指引、交付范围与限制：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"submit","object":"user-acceptance","revision":"<state.deployment>","upstream":"<state.revisions.tests>"}
      ```

      2. 用户亲自操作并反馈，未接受或仍需修改就等待或回到受影响阶段。
         普通评论、沉默和 Agent 自验不代表验收通过。
      3. 明确接受后核对当前交付、前序及并发，记录内容确认，不引用事件 ID：

      ```json
      {"at":"<current-UTC-ISO-time>","type":"signOff","object":"user-acceptance","revision":"<state.deployment>"}
      ```

      4. 按授权检查并同步 submit/signOff，重新观察所有 Rules，只有最终同步完成才声明 completed。
      相同版本重复提交不要求再次决定，但不得用于跳过用户实际体验、验证或新的部署轮次。
    rules:
      - code: user-acceptance-confirmed
        description:
          前序均通过后，当前 user-acceptance submit.revision 等于 deployment
          报告摘要， upstream 仅为当前 tests
          revision；同版本已提交且用户明确接受后有有效 signOff。 报告最新 start
          的 implementation 等于当前有效实现，该提交含当前五个递归确认版本。
          signed.user-acceptance 等于报告摘要，不保存事件
          ID；任一交付或前序失效先回 owning 阶段。 仅 Schema
          合法不证明用户身份或实际体验，反馈与 Agent 自验不作为确认。
      - code: user-acceptance-synchronized
        description:
          当前交付的有效 submit/signOff、全部前序内容及证据须包含于本次
          primary， 工作区洁净且 HEAD=primary tip。确认有效未同步为
          synchronization/next=user-acceptance； 两者均满足才 completed。primary
          不可用或并发变化明确报错，不伪造成功。
    output:
      description:
        成功为 undefined，Task 可报告完成，但不自动写事件、发布或执行其他操作。
