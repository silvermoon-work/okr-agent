# Approved design; runtime-generated Spec: silvermoon-single-checker.yaml.
# Historical proposal remains silvermoon-idea-check-candidate.yaml.
$schema: urn:ipfsaw:check-bundle:1
specVersion: "1.0"
name: Silvermoon · 平级文件夹与统一 Checkpoint 推进
description: |
  标准化前提与推进分离。七个平级文件夹位于 .silvermoon/i/<id>/，
  events.jsonl 的唯一首条 created 固定 idea/at/eventSchemaCid，无 idea.json。
  revision 是 owning 文件夹真实 Git TREE ID；upstream 是直接前置文件夹真实
  Git TREE ID，根为 null。不合成 material/upstream 树或递归嵌入依赖。
  submit 与 accept 使用相同 object/revision/upstream tuple，
  accept 另有 authority=user|delegate；无事件 id/version、signOff、verify 或 rollback。
  可选严格 checkpointAcceptance 默认 test-spec/implementation delegated，其余 consensus；
  consensus 仅认可 user，delegated 认可 user/delegate，收紧自然使旧 delegate 接受失效。
  顺序 measure 首个 owning submit/accept/synchronization，文件夹或前置/祖先失效自然退化；
  相同 tuple 重复 submit 幂等，不重置匹配接受。
  Check 只判断事件状态、当前 revision/upstream 与仓库匹配、权限政策、历史/协议、
  标准化与同步，不判断测试、CI、报告真实性、用例完整性、受测代码或 commit/path 声明绑定。
  Agent 的真实实现测试及部署/用户体验责任是指引，不是机器谓词。
  完整规则见 silvermoon-events.md；旧数据只读按原契约检查，不自动转换或迁移。
parameter:
  schema:
    type: object
    additionalProperties: false
    required: [userHome, repoRoot, idea]
    properties:
      userHome: { type: string, minLength: 1 }
      repoRoot: { type: string, minLength: 1 }
      idea: { type: string, minLength: 1 }
checkpoints:
  - id: global
    title: 全局 Silvermoon 已标准化
    description: 核验实际运行安装、个人 canonical skill 链接和用户配置。
    instructions:
      修复标准化前提后重试，不自动安装或复制项目内 skill，不记录 submit/accept。
    rules:
      - code: global-runtime-ready
        description: PATH 首个规范 bin 属于实际安装。
      - code: global-skill-linked
        description: 个人发现路径链接至实际安装 canonical skill。
      - code: global-configuration-valid
        description: 用户配置采用支持的协议、字段及规范语言标签。
  - id: repository
    title: 仓库已处于标准工作状态
    description: 安全 Git 根、有效 HEAD、关联分支和洁净工作区。
    instructions:
      保留已有工作，按授权通过普通 Git 操作修复；不自动
      stage/commit/push/clean。
    rules:
      - code: repository-root-valid
        description: 普通安全可读仓库根，非子目录或重定向。
      - code: repository-branch-attached
        description: 有效 HEAD 关联本地分支。
      - code: repository-worktree-clean
        description: 所有材料与事件已经提交，无暂存/未暂存/未跟踪变化。
  - id: branch
    title: 项目配置与 primary 同步已标准化
    description: 核验 primary 政策、跟踪关系和准确同步。
    instructions: 不改 primary 或自行提权绕过接受；不自动集成/推送并发历史。
    rules:
      - code: branch-silvermoon-config-valid
        description:
          配置协议、primaryRepository/primaryBranch 和可选严格
          checkpointAcceptance 合法。
      - code: branch-upstream-aligned
        description: upstream 对应配置的 primary 仓库及分支。
      - code: branch-primary-synchronized
        description:
          HEAD 等于本次准确观察的 primary tip；本地模式不声明网络新鲜性。
  - id: silvermoon-folder
    title: Silvermoon 容器已标准化
    description: 核验普通安全容器及容量。
    instructions: i 在首个 Idea 前可不存在，不扫描或迁移其他 Ideas。
    rules:
      - code: silvermoon-folder-path-valid
        description: .silvermoon、config.yaml 和可选 i 类型、路径及容量安全。
  - id: idea-folder
    title: Idea 数据与版本已标准化
    description: created-first 信任、平级布局、真实文件夹树及 append-only 历史。
    instructions: |
      先用固定最小有界 reader 读取 created 的 idea/at/eventSchemaCid/可选 language，
      再用已知可信不可变自包含 Draft 2020-12 Schema 校验整个日志，包括 created。
      Schema 为 RFC8785 JCS UTF-8 SHA256 CIDv1 raw/base32，离线保存准确资源；
      未知 Schema 明确失败，不 fallback 或改历史 CID。执行 Check CID 单独记录。
      七个文件夹安全、可读可测量，Spec.md 为提示而非模板验证。
      revision/upstream 是实际 owning/直接前置文件夹 tree ID，mode/blob 参与。
      只解释事件、当前版本、政策、顺序历史和同步，不检查实现或报告真实性。
      保留 created 身份与 primary 原始 UTF-8 事件前缀；日志 1 MiB/4096 LF 行，
      总候选 16 MiB/2048 文件，拒绝链接、越界、无效编码、未知字段及并发变化。
      历史 idea.json/checkCid/id/version 数据按原契约只读，导航须明确迁移，本轮不迁移。
    rules:
      - code: idea-folder-identity-immutable
        description:
          created 首条唯一，idea/at/eventSchemaCid 保留 primary 身份。
      - code: idea-folder-schema-binding-valid
        description: 精确可信 Schema 字节、CID 和受控校验约束有效，无静默替代。
      - code: idea-folder-history-append-only
        description:
          原始 canonical UTF-8 事件字节保留准确前缀，只追加完整 LF 行。
      - code: idea-folder-data-valid
        description:
          安全平级材料、真实目录树、最小事件形态及直接 tuple 有序历史有效。
      - code: idea-folder-active
        description: 显式放弃须有效 resume 才恢复。
    output:
      description:
        同一次 reduce 的七个 revisions、submitted/accepted
        tuples、authority、模式及首个 owning level/step。
  - id: requirements
    title: 需求规格
    description: 需求文件夹 tree 的提交、认可接受与同步。
    instructions:
      完成 requirements/Spec.md 及所需附件；submit(upstream=null)，默认用户明确
      accept，再同步。
    rules:
      - code: requirements-submission-current
        description: 最新 submit 的 revision 为当前文件夹 tree，upstream=null。
      - code: requirements-acceptance-valid
        description: accept 匹配完整 tuple，来源被当前模式认可。
      - code: requirements-synchronized
        description: 当前文件夹和有效 submit/accept 存于准确 primary。
  - id: research-scope
    title: 调研范围
    description: 调研范围文件夹 tree、需求前置和认可接受与同步。
    instructions:
      在 research-scope/Spec.md
      及支持材料写问题、风险和待查证事实；默认用户接受。
    rules:
      - code: research-scope-submission-current
        description:
          当前文件夹 tree 与直接 requirements tree 匹配最新 submit，前置有效。
      - code: research-scope-acceptance-valid
        description: 完整 tuple 的 accept 来源被政策认可。
      - code: research-scope-synchronized
        description: 材料及有效事件存于准确 primary。
  - id: technical-spec
    title: 技术规格
    description: 技术规格文件夹 tree、调研前置及认可接受与同步。
    instructions:
      在 technical-spec/Spec.md 及支持材料写调研依据、取舍及方案；默认用户接受。
    rules:
      - code: technical-spec-submission-current
        description:
          当前文件夹 tree 与直接 research-scope tree 匹配最新 submit，前置有效。
      - code: technical-spec-acceptance-valid
        description: 完整 tuple 的 accept 来源被政策认可。
      - code: technical-spec-synchronized
        description: 材料及有效事件存于准确 primary。
  - id: test-scope
    title: 测试范围
    description: 测试范围文件夹 tree、技术前置及认可接受与同步。
    instructions:
      test-scope/Spec.md
      描述测试范围和预期结果，不强制机器用例索引；默认用户接受。
    rules:
      - code: test-scope-submission-current
        description:
          当前文件夹 tree 与直接 technical-spec tree 匹配最新 submit，前置有效。
      - code: test-scope-acceptance-valid
        description: 完整 tuple 的 accept 来源被政策认可。
      - code: test-scope-synchronized
        description: 材料及有效事件存于准确 primary。
  - id: test-spec
    title: 测试规格
    description: 测试规格文件夹 tree、范围前置及委托接受与同步。
    instructions:
      test-spec/Spec.md 描述操作/条件/预期；默认 delegated，Agent 实际审阅后
      accept，不省略 submit。
    rules:
      - code: test-spec-submission-current
        description:
          当前文件夹 tree 与直接 test-scope tree 匹配最新 submit，前置有效。
      - code: test-spec-acceptance-valid
        description:
          完整 tuple 的 accept 来源被政策认可；默认 user/delegate，收紧后仅
          user。
      - code: test-spec-synchronized
        description: 材料及有效事件存于准确 primary。
  - id: implementation
    title: 实现交付物
    description:
      实现交付文件夹 tree、测试规格前置及委托接受与同步，不判定代码/CI。
    instructions: |
      implementation/Spec.md 及支持文档记录交付；提交材料记录增删改哪些 TEST CASES、
      提交到哪个 commit。Agent 在 accept 前验证包含该 commit 的本地测试或 CI 通过。
      这些是材料和 Agent 指令，不是 tracked-declaration Schema、scope paths 或 CI 机器谓词。
      revision 是 implementation 文件夹 tree，不是仓库代码范围或受测 commit；
      submit(upstream=test-spec tree)，默认 delegated accept 后同步。
    rules:
      - code: implementation-submission-current
        description:
          当前 implementation 文件夹 tree 与直接 test-spec tree 匹配最新
          submit，前置有效。
      - code: implementation-acceptance-valid
        description:
          完整 tuple 的 accept 来源被政策认可；不判断测试执行、覆盖或
          commit/path 绑定。
      - code: implementation-synchronized
        description: 当前文件夹材料及有效事件存于准确 primary。
  - id: deployment
    title: 部署交付物
    description:
      部署文件夹 tree、实现前置及最终用户接受与同步，不判定报告真实性。
    instructions: |
      Agent 自验实际部署结果，记录 deployment/Spec.md 及所需支持材料；
      不强制固定 report.jsonl、start/case Schema 或结果集合。
      submit(upstream=implementation tree) 后用户 hands-on 实际操作并明确 accept(user)。
      用户接受就是本关 accept，无独立 user-acceptance checkpoint。
      默认 consensus；最终同步并重新观察所有关口后 completed，不写 verify/rollback。
    rules:
      - code: deployment-submission-current
        description:
          当前 deployment 文件夹 tree 与直接 implementation tree 匹配最新
          submit，前置有效。
      - code: deployment-acceptance-valid
        description:
          完整 tuple 的 accept 来源被政策认可；不判断报告、用例或部署真实性。
      - code: deployment-synchronized
        description:
          当前材料及所有有效前序与事件已在准确 primary，全部通过才 completed。
