$schema: urn:ipfsaw:check-bundle:1
specVersion: "1.0"
name: Silvermoon · 项目就绪检查
description:
  供 silvermoon check-project 独立检查项目是否处于可开始工作的状态， 也供
  silvermoon create-idea 在创建文件前执行的独立 Check Task， 检查当前设备、Git
  仓库、primary 跟踪同步关系、Silvermoon 数据容器和提交 hook
  是否就绪，不仅是配置校验。 本 Task 不需要 Idea 参数，不读取既有 Idea
  内容，不创建目录、写入事件或记录批准。
  通过只表示本次观察项目就绪，不是持久授权；CLI
  写入时仍须加锁并重新核对仓库与内容， 防止检查通过后发生的并发变化。与 Idea
  推进、候选变更合法性两个 Task 独立；
  相同前提规则应共享实现，不复制出另一套判定。
parameter:
  schema:
    type: object
    additionalProperties: false
    required: [userHome, repoRoot]
    properties:
      userHome:
        type: string
        minLength: 1
        description:
          用户 home 的绝对路径，用于检查个人配置、skill 和 Git 执行上下文。
      repoRoot:
        type: string
        minLength: 1
        description:
          待检查的 Git 仓库根目录绝对路径；有效性由检查点核验，不要求已有 Idea。
checkpoints:
  - id: global
    title: 全局 Silvermoon 已正确配置
    description: 检查全局 Silvermoon 安装、个人 skill 链接及用户配置是否有效。
    instructions:
      按下列 Rules 修复实际安装、个人 skill 或配置问题后，重试原命令。
      不自动安装、升级、链接或更改配置；需要这些操作时遵守独立授权。
      不通过添加项目依赖或复制项目内 skill 绕过设备边界。
    rules:
      - code: global-runtime-ready
        description:
          实际运行入口必须是当前 @silvermoon-work/silvermoon 安装的规范 bin， 且
          PATH 可发现的首个 silvermoon 命令指向同一安装。
          允许全局链接的开发版本，不要求每次联网查询 registry 最新版。
      - code: global-skill-linked
        description:
          受支持的个人发现路径（.agents/skills/silvermoon 或
          .copilot/skills/silvermoon） 必须通过有效链接指向当前安装的 canonical
          skill，不能是副本、失效链接或其他安装的 skill。
      - code: global-configuration-valid
        description:
          个人配置存在时必须可解析、协议版本受支持、字段合法且语言标签有效；
          协议允许缺省时，配置可以不存在。
    output:
      description: 本次已经验证的个人语言设置，只在本次执行内共享，不声明创建已完成。
      fields:
        - name: userLanguage
          description:
            规范语言标签或 undefined；用于后续创建的语言继承， 不包含实际写入的
            Idea 身份或调用方声明的 ready 标记。
  - id: repository
    title: 仓库在可开始工作的状态
    description: 检查仓库根目录有效、HEAD 关联本地分支，且工作区没有未提交内容。
    instructions:
      保留所有已有修改，通过普通且获授权的 Git 操作整理候选并提交；
      不通过删除、隐藏或重置改动来取得通过。本检查点不解析既有 Idea， 不自动执行
      stage、commit、push 或 clean；修复后重试原命令。
    rules:
      - code: repository-root-valid
        description:
          repoRoot 必须是可安全读取且有有效 HEAD 的 Git 仓库根目录，
          不能是重定向路径、仓库子目录或尚无提交的仓库。
      - code: repository-branch-attached
        description: 当前 HEAD 必须关联本地分支，不能处于 detached HEAD 状态。
      - code: repository-worktree-clean
        description:
          工作区必须无已暂存、未暂存或未跟踪的改动。 检查本身不写入锁或
          scaffold，因此不需要忽略自己创建的临时文件。
    output:
      description:
        固定本次观察的仓库范围和起始提交，不把 Git 状态推断成人类批准。
      fields:
        - name: root
          description: 已验证的仓库根目录，后续配置与 Git 观察只在该范围进行。
        - name: head
          description:
            本次观察开始时的准确提交 ID，用于检测检查过程中的并发变化。
  - id: branch
    title: 分支已正确跟踪并同步 primary
    description:
      检查项目配置、primary 存在性与 upstream 关系，并核验 HEAD 已同步。
    instructions:
      按现有授权通过普通 Git 操作集成双方历史并同步到配置的 primary，
      不通过改配置、强制推送或移动分支绕过前提。
      远端不可用或观察不确定时明确报告，不将本地旧快照冒充远端最新事实。
      检查可获取配置的 primary，但不自动 pull、merge、rebase 或 push。
    rules:
      - code: branch-silvermoon-config-valid
        description:
          项目配置必须存在、可按支持的协议解析， 并声明有效的 primaryRepository
          与 primaryBranch。
      - code: branch-primary-present
        description:
          配置的远端仓库必须存在指定 primaryBranch；
          查询失败或不确定不能视作已确认不存在，也不能视作通过。
      - code: branch-upstream-aligned
        description:
          当前本地分支必须有 upstream，且其远端仓库和分支 与配置的
          primaryRepository、primaryBranch 一致。
      - code: branch-primary-synchronized
        description:
          HEAD 必须等于本次获取的 primary tip；获取失败不能使用旧快照成功回退。
          观察期间 HEAD 和工作区必须仍与仓库检查点固定的事实一致；
          并发变化或取消按执行错误处理，不产生可复用的创建许可。
    output:
      description: 本次已核验的项目配置和 primary 观察，仅在执行期有效。
      fields:
        - name: project
          description: 当前仓库 root 与有效配置对象，不读取既有 Ideas。
        - name: observed
          description:
            本次 HEAD、primary tip、remote 与变更事实。
            创建写入层必须重新核验适用性，不能将这次通过当成跨执行的授权。
  - id: silvermoon-folder
    title: Silvermoon 数据容器有效
    description: 检查元数据目录、配置文件及可选 Idea 容器的路径和读取安全性。
    instructions:
      修复下列 Rules 指出的目录或文件类型问题后重试原命令。 首个 Idea 创建前 i
      目录不存在是正常状态；检查不替 CLI 建目录， 不扫描、迁移、删除或修复既有
      Ideas。通过后继续检查提交 hook，不开始任何创建事务；仅 create-idea
      在全部检查通过后才由 CLI 开始创建事务。写入期间仍需独占锁、唯一 ID
      分配、并发复核和仅清理本次拥有文件的失败恢复。 这些事务行为不是本 Task
      的副作用，也不因前提检查通过而省略。
    rules:
      - code: silvermoon-folder-path-valid
        description:
          .silvermoon 必须是普通目录，不能是符号链接、重定向路径或其他文件类型。
      - code: silvermoon-folder-config-file-valid
        description:
          .silvermoon/config.yaml 必须是普通文件，
          路径无重定向且大小不超过协议容量限制。
      - code: silvermoon-folder-ideas-directory-valid
        description:
          首个 Idea 创建前 .silvermoon/i 可以不存在；
          存在时必须是普通安全目录，不能是链接或重定向路径。
    output:
      description:
        成功不新增数据，pass output 为 undefined。 Task
        全部通过仅证明本次项目就绪检查通过； 不分配 Idea ID、不写入 created
        事件、不证明 scaffold 已成功落盘。
  - id: pre-commit
    title: 提交前自动检查 Silvermoon 候选
    description:
      检查 Git 实际使用的 pre-commit hook 会校验暂存候选并阻止非法提交。
    instructions: |
      通过 `git rev-parse --path-format=absolute --git-path hooks`
      定位 Git 实际使用的 hooks 目录，再追加 pre-commit 文件名，
      避免 Git 提前解析文件符号链接；尊重 core.hooksPath 与 linked worktree。
      检查本身只读文件，不执行 hook，也不自动修改 Git 配置或安装 hook。
      用户授权配置后，保留已有逻辑，采用下列可验证的 shell 前缀：

      ```sh
      #!/bin/sh
      # BEGIN Silvermoon check-changes
      silvermoon check-changes --staged --audience agent || exit $?
      # END Silvermoon check-changes
      ```

      已有兼容的 sh hook 可在此前缀后保留原脚本正文；不能覆盖或丢弃原逻辑。
      若原 hook 使用其他解释器或 hook manager，先明确集成方式，不擅自转换。
      非 Windows 设备须为 hook 设置执行权限。配置后的 hook 使用设备级 silvermoon，
      不使用项目依赖或源码路径。失败必须向 Git 返回非零，不能使用 || true、
      后续命令或只检查工作区来掩盖暂存候选失败。
      若 hook 作为仓库文件管理，按普通授权流程提交并同步后重试原命令。
    rules:
      - code: pre-commit-hook-configured
        description:
          Git 根据有效配置（包括 core.hooksPath）解析到的 pre-commit 必须存在，
          为有界 UTF-8 常规文件而非符号链接，非 Windows 平台还必须可执行。
          文件必须使用 LF（Windows 上也接受规范化后的
          CRLF），以下列四行及末尾换行开始： "#!/bin/sh"、"# BEGIN Silvermoon
          check-changes"、 "silvermoon check-changes --staged --audience agent
          || exit $?"、 "# END Silvermoon check-changes"。前缀后允许保留已有
          shell 逻辑。 不执行或推测任意脚本、注释、条件分支、间接 wrapper 或
          hook manager
          的等价性；其他集成形式返回明确的配置缺口，不视作已经验证。
          缺失、无效内容或不可执行是不通过；意外 I/O、取消和并发变更是执行错误。
    output:
      description:
        成功输出为 undefined；不安装、执行 hook 或记录跨执行就绪状态。
