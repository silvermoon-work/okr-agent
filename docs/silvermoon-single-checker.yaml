$schema: urn:ipfsaw:check-bundle:1
specVersion: "1.0"
name: Silvermoon · Idea 有序检查点（设计稿，未实现）
parameter:
  schema:
    type: object
    additionalProperties: false
    required:
      - userHome
      - repoRoot
      - idea
    properties:
      userHome:
        type: string
        minLength: 1
        description: 用户 home 的绝对路径，不是 Silvermoon 配置目录。
      repoRoot:
        type: string
        minLength: 1
        description: 待观察 Git 仓库根目录的绝对路径；有效性由仓库检查点核验。
      idea:
        type: string
        minLength: 1
        description: 待解析的 Idea ID 或 alias；存在性与唯一性由观察检查点核验。
  preconditions:
    - 调用方已选定拟观察的用户、仓库和 Idea，并获准在该范围读取必要事实。
    - 宿主通过独立执行依赖提供真实运行上下文，并明确本次 Git 刷新授权；这些不是
      Target 字段或 readiness 证明。
    - 所有检查点共享同一 Target 和本次不可变仓库／Idea 观察，绑定同一
      HEAD、刷新后的 primary、reducer、revisions
      与受测对象事实；通过继续，不通过即停止。
    - 此文件只描述设计，不执行检查、LLM 或项目测试，不代写
      resume、stage、commit、push 或 clean，也不以日志陈述替代事实核验。
checkpoints:
  - id: environment
    title: Silvermoon 环境前置
    description:
      核验 Silvermoon 安装、执行入口、PATH、个人 skill 链接及用户配置。
    rules:
      - code: environment-runtime
        description:
          实际运行入口必须是有效 Silvermoon 安装的规范 bin，且 PATH 可发现的首个
          silvermoon
          命令指向同一安装；允许全局链接的开发版本，不要求每次联网查询 registry
          最新版。
      - code: environment-skill
        description:
          个人发现路径必须通过有效链接指向当前安装的 canonical
          skill，不能是副本、失效链接或其他安装的 skill。
      - code: environment-configuration
        description: 个人配置存在时必须可解析、协议版本受支持、字段合法且语言标签有效；协议允许缺省时，配置可以不存在。
  - id: repository
    title: 仓库前置
    description:
      核验仓库、项目配置、分支跟踪、远端同步与工作区，确保内容已提交并与刷新后的
      primary 对齐。
    rules:
      - code: repository-root-invalid
        description: repoRoot 必须存在、为目录，并且是目标 Git 仓库的根目录。
      - code: project-configuration-invalid
        description:
          项目配置必须存在、可按支持的协议解析，并声明有效的 primaryRepository
          与 primaryBranch。
      - code: project-layout-invalid
        description: 基础文件树必须满足安全和容量约束，不接受非法路径重定向、文件类型、越界内容或容量超限。
      - code: primary-branch-missing
        description:
          配置的远端仓库必须存在指定
          primaryBranch；查询失败或不确定不能视作已确认不存在。
      - code: branch-detached
        description: 当前 HEAD 必须关联本地分支，不能处于 detached HEAD 状态。
      - code: branch-upstream-mismatch
        description:
          当前本地分支必须有 upstream，且其远端仓库和分支与配置的
          primaryRepository、primaryBranch 一致。
      - code: primary-sync-required
        description:
          HEAD 必须等于本次授权刷新后的远端 primary
          tip，不能以旧的本地远端跟踪引用代替。
      - code: worktree-uncommitted
        description:
          工作区必须无已暂存、未暂存或未跟踪的改动，Idea
          草稿和事件也必须已提交；检查本身不执行 stage、commit、push 或 clean。
      - code: event-history-rewritten
        description:
          相对于 primary，已记录的 Idea
          事件历史必须保持追加，不得删除、修改或重排已有事件。
      - code: idea-identity-modified
        description:
          相对于 primary，已存在 Idea 的 bootstrap 身份字段必须保持不变。
  - id: observation
    title: 建立 Idea 观察
    description:
      核验所选 Idea 的身份、文件、events 与固定 Check
      CID，建立有效观察并确认未放弃。
    rules:
      - code: idea-invalid
        description:
          Idea 必须能够唯一解析，bootstrap、事件、文件树、用例索引及固定 Check
          CID 绑定必须符合现有协议、结构、安全与容量约束。
      - code: abandoned
        description:
          有效事件序列推导的状态必须不是 `state.level =
          abandoned`；放弃不是完成或跳过门禁，只有显式有效的 resume
          事实才能恢复，Agent 或 CLI 不得自动代写。
  - id: requirements
    title: 需求共识与同步
    description: 核验 requirements 树当前版本的人类确认及 primary 同步。
    rules:
      - code: requirements
        description:
          当前 requirements 必须有匹配准确内容版本的有效显式人类 sign off，且其
          upstream 为空；受签署范围内的任何变更都须重新确认，reducer 不应停留在
          `state.level = requirements`。
      - code: synchronization
        description:
          当前准确需求内容和对应 sign off 必须已同步至本次观察的
          primary，不得处于 `state.level = synchronization` 且 `state.next =
          requirements`。
  - id: research
    title: 调研共识与同步
    description:
      核验 technical/research.md 当前版本的人类确认及 primary
      同步，绑定当前需求版本。
    rules:
      - code: research
        description:
          当前调研问题索引必须有匹配准确版本及前序需求向量的有效显式人类 sign
          off，reducer 不应停留在 `state.level = research`。
      - code: synchronization
        description:
          当前准确调研索引、前序需求与对应 sign off 必须已同步至本次观察的
          primary，不得处于 `state.level = synchronization` 且 `state.next =
          research`。
  - id: technical
    title: 技术共识与同步
    description:
      核验 technical 树（除 research.md）当前版本的人类确认及 primary
      同步，绑定当前需求与调研版本。
    rules:
      - code: technical
        description:
          当前 Technical Spec 及补充材料必须有匹配准确版本且恰好绑定全部前序
          revisions 的有效显式人类 sign off，reducer 不应停留在 `state.level =
          technical`。
      - code: synchronization
        description:
          当前准确技术内容、全部前序内容与对应 sign off 必须已同步至本次观察的
          primary，不得处于 `state.level = synchronization` 且 `state.next =
          technical`。
  - id: cases
    title: 用例索引共识与同步
    description:
      核验 tests/cases.json 当前版本的人类确认及 primary
      同步，绑定全部前序版本。
    rules:
      - code: cases
        description:
          当前用例索引必须有匹配准确版本且恰好绑定全部前序 revisions
          的有效显式人类 sign off，reducer 不应停留在 `state.level = cases`。
      - code: synchronization
        description:
          当前准确用例索引、全部前序内容与对应 sign off 必须已同步至本次观察的
          primary，不得处于 `state.level = synchronization` 且 `state.next =
          cases`。
  - id: tests
    title: 测试共识与同步
    description:
      核验 tests 树（除 cases.json）当前版本的人类确认及 primary
      同步，绑定全部前序版本。
    rules:
      - code: tests
        description:
          当前 Test Spec 及补充材料必须有匹配准确版本且恰好绑定全部前序
          revisions 的有效显式人类 sign off，reducer 不应停留在 `state.level =
          tests`。
      - code: synchronization
        description:
          当前准确测试内容、全部前序内容与对应 sign off 必须已同步至本次观察的
          primary，不得处于 `state.level = synchronization` 且 `state.next =
          tests`。
  - id: implementation
    title: 实现验收
    description: 核验全部必需实现环境的最新证据批次，确认用例完整通过且版本、受测提交与证据匹配。
    rules:
      - code: implementation
        description:
          五个准确版本的共识及各自 primary
          同步满足后，每个必需实现环境的最新批次必须完整覆盖其全部实现用例并通过，绑定当前五个
          revision、准确受测提交，且证据路径及内容哈希有效；reducer 不应停留在
          `state.level =
          implementation`。新失败、错误或不完整批次使同环境旧成功批次失效；后续提交只增加本
          Idea
          事件／证据时不使受测代码过期，其他受跟踪内容变化必须重新验证；Check
          只核验事实绑定，不执行 LLM 或项目测试，也不保证日志陈述真实。
  - id: deployment
    title: 部署验收
    description: 核验全部必需部署环境的最新证据批次，确认完整通过且绑定当前实现批次集合。
    rules:
      - code: deployment
        description:
          每个必需部署环境必须具备当前完整通过批次，满足同样的版本、受测对象、证据路径及哈希校验，并绑定当前有效实现批次集合的准确摘要；reducer
          不应停留在 `state.level =
          deployment`。新实现批次使旧实现摘要对应的部署证据失效；不增加人类实现／部署结果
          sign off，不以部署命令返回成功替代 Evidence。
  - id: completion
    title: 完成与终态同步
    description: 核验完成状态与最终事件、证据的提交及 primary 同步。
    rules:
      - code: completion-unsynchronized
        description:
          reducer 必须为
          completed，且当前事件与证据均已提交并同步，工作区无改动、HEAD
          等于本次观察到的 primary tip，才可最终通过；不接受手写 completed
          标记。若前序检查点通过而同一观察的 reducer 结论不是
          completed，须将内部前置／状态映射不一致作为执行错误传播，不能默认通过。
