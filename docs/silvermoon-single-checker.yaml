      Synchronize material and events normally; preserve history. A changed folder or predecessor requires resubmission, not rollback.
      Replace placeholders with freshly observed full IDs and canonical UTC time:
      ```json
      {"at":"<UTC>","type":"submit","object":"deployment","revision":"<deployment-folder-tree>","upstream":"<direct-predecessor-folder-tree>"}
      ```
      Only after actual authorized acceptance, append the same tuple:
      ```json
      {"at":"<UTC>","type":"accept","object":"deployment","revision":"<deployment-folder-tree>","upstream":"<direct-predecessor-folder-tree>","authority":"user"}
      ```
      The sample authority follows defaults; obey the effective project policy and actual acceptance source.
    rules:
      - code: deployment-submission-current
        description:
          Latest submission matches the actual current folder tree and direct
          predecessor tree (root null).
      - code: deployment-acceptance-valid
        description:
          Acceptance matches the submission's complete tuple and current
          authority policy.
      - code: deployment-synchronized
        description:
          Current folder, submission and recognized acceptance exist in observed
          primary.
    output:
      description:
        No persistent marker; later checkpoints reuse the same observation.
