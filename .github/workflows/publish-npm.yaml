name: Publish one verified npm package
on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      package:
        description:
          Bootstrap only - legacy package ID for the installed rc.1 gate
        required: true
        type: string
permissions: {}
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGE_INPUT: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Select one registered npm package
        id: target
        run: |
          target="$(pnpm exec publish-gate target --json)"
          printf '%s\n' "$target" | jq -r '"directory=\(.directory)\nname=\(.name)\nchannel=\(.channel)"' >> "$GITHUB_OUTPUT"
          directory="$(printf '%s\n' "$target" | jq -r '.directory')"
          jq -e '.scripts.prepublishOnly == "publish-gate check"' "$directory/package.json" > /dev/null
      - name: Build selected package and dependencies
        env:
          PACKAGE_NAME: ${{ steps.target.outputs.name }}
        run: pnpm --filter "$PACKAGE_NAME..." run build
      - name: Publish through the installed lifecycle gate
        env:
          PACKAGE_DIRECTORY: ${{ steps.target.outputs.directory }}
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          PNPM_CONFIG_ACCESS: public
          PNPM_CONFIG_TAG: ${{ steps.target.outputs.channel }}
          PNPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_DRY_RUN:
            ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: pnpm --dir "$PACKAGE_DIRECTORY" publish --no-git-checks
